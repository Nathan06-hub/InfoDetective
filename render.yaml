services:
  - type: web
    name: infodetective
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MOCK_DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        value: "sqlite:///./infodetective.db"
      - key: GEMINI_API_KEY
        sync: false
